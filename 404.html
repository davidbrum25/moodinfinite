<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#121110">
    <meta name="color-scheme" content="dark">
    <title>404 - Moodinfinite</title>
    <link rel="icon" href="fav_icon_alternative.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            background-color: #121110;
            color: #F4F1EA;
            color-scheme: dark;
        }
        ::selection {
            background: #2589BD;
            color: #FFFFFF;
        }
        body {
            background-color: #121110;
            color: #F4F1EA;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .error-card {
            width: 100%;
            max-width: 440px;
            background-color: #24201B;
            border: 1px solid #7A6E60;
            border-radius: 0;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }
        .error-logo {
            width: 48px;
            height: 48px;
            display: inline-block;
            margin-bottom: 1rem;
            vertical-align: middle;
        }
        .error-kicker {
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #D4A359;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.035em;
            color: #F4F1EA;
            margin-bottom: 0.75rem;
        }
        .error-desc {
            font-size: 1rem;
            color: rgba(244, 241, 234, 0.65);
            margin-bottom: 2rem;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            min-width: 44px;
            padding: 0.625rem 1.5rem;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 0.9375rem;
            font-weight: 500;
            color: #F4F1EA;
            background-color: rgba(36, 32, 27, 0.7);
            border: 1px solid rgba(244, 241, 234, 0.12);
            border-radius: 9999px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 150ms cubic-bezier(0.16, 1, 0.3, 1), border-color 150ms cubic-bezier(0.16, 1, 0.3, 1), color 150ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-home:hover {
            background-color: rgba(212, 163, 89, 0.15);
            border-color: #D4A359;
            color: #FFFFFF;
        }
        .btn-home:focus-visible {
            outline: 2px solid #2589BD;
            outline-offset: 3px;
        }
        @media (prefers-reduced-motion: reduce) {
            .btn-home {
                transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
            }
        }
    </style>
</head>
<body>
    <main class="error-card">
        <img src="fav_icon_alternative.png" alt="Moodinfinite" width="48" height="48" class="error-logo">
        <p class="error-kicker">ERROR 404</p>
        <h1>404</h1>
        <p class="error-desc">No encontramos la página que estás buscando.</p>
        <a href="/" class="btn-home">Volver a Moodinfinite</a>
    </main>
</body>
</html>
