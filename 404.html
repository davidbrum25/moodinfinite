<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 - Moodinfinite</title>
    <link rel="icon" href="fav_icon_alternative.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            background-color: #24201B;
            color: #F4F1EA;
        }
        body {
            background-color: #24201B;
            color: #F4F1EA;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            line-height: 1.5;
            overflow-x: hidden;
        }
        .error-card {
            width: 100%;
            max-width: 440px;
            background-color: #24201B;
            border: 1px solid #7A6E60;
            border-radius: 4px;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }
        .error-logo {
            width: 48px;
            height: 48px;
            display: inline-block;
            margin-bottom: 1.25rem;
            vertical-align: middle;
        }
        h1 {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #F4F1EA;
            margin-bottom: 0.75rem;
        }
        p {
            font-size: 1rem;
            color: #B8AFA0;
            margin-bottom: 2rem;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            min-width: 44px;
            padding: 0.625rem 1.5rem;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #F4F1EA;
            background-color: #24201B;
            border: 1px solid #7A6E60;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }
        .btn-home:hover {
            background-color: #3A342C;
            border-color: #B8AFA0;
        }
        .btn-home:focus-visible {
            outline: 2px solid #D4A359;
            outline-offset: 2px;
        }
        @media (prefers-reduced-motion: reduce) {
            .btn-home {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="error-card">
        <img src="fav_icon_alternative.png" alt="Moodinfinite" width="48" height="48" class="error-logo">
        <h1>404</h1>
        <p>No encontramos la página que estás buscando.</p>
        <a href="/" class="btn-home">Volver a Moodinfinite</a>
    </main>
</body>
</html>
